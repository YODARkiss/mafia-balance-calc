<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Стол — калькулятор мафии</title>
  <meta name="description" content="Калькулятор баланса и тайминга стола мафии для ведущего" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-bg: #0c0c0e;
      --color-card: #141418;
      --color-elevated: #1c1c22;
      --color-fg: #f1f1f3;
      --color-muted: #9a9aa3;
      --color-border: color-mix(in oklab, #f1f1f3 12%, transparent);
      --color-accent: #d4d6dc;
      --color-accent-fg: #0c0c0e;
      --color-ok: #8fbfa4;
      --color-ok-bg: #14201a;
      --color-warn: #d4b896;
      --color-warn-bg: #241c14;
      --font-display: "Fraunces", "Times New Roman", serif;
      --font-sans: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
    }
  </style>
  <style>
    html, body { background: #0c0c0e; color: #f1f1f3; font-family: "Source Sans 3", system-ui, sans-serif; min-height: 100%; margin: 0; overflow-x: hidden; }
    button:not(:disabled), [role="button"]:not(:disabled) { cursor: pointer; }
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
  </style>
</head>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Стол — калькулятор мафии</title>
<style>
:root{--bg:#0c0c0e;--card:#141418;--el:#1c1c22;--fg:#f1f1f3;--mu:#9a9aa3;--bd:#2a2a32;--acc:#d4d6dc;--accfg:#0c0c0e;--ok:#8fbfa4;--okbg:#14201a;--warn:#d4b896;--warnbg:#241c14}
*{box-sizing:border-box}
html,body{margin:0;background:linear-gradient(#0c0c0e,#101014);color:var(--fg);font:16px/1.45 system-ui,Segoe UI,sans-serif;min-height:100%}
#app{max-width:36rem;margin:0 auto;padding:1.25rem 1rem 4rem}
h1{font:600 1.6rem/1.15 Georgia,serif;margin:.15rem 0}
h2{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin:1rem 0 .4rem}
.kicker{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:0}
.muted{color:var(--mu);font-size:.9rem}
.ok{color:var(--ok)} .warn{color:var(--warn)}
.card{border:1px solid var(--bd);background:var(--card);border-radius:1rem;padding:1rem;margin:0 0 .75rem}
.row-between{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.75rem;align-items:center}
.step{display:flex;align-items:center;gap:.5rem;margin:.6rem 0}
.step button,.btn{min-width:2.75rem;height:2.75rem;border:1px solid var(--bd);background:var(--el);color:var(--fg);border-radius:.5rem;font-size:1.1rem}
.btn{width:100%;min-height:2.75rem;height:auto;padding:.35rem .4rem;font-size:.8rem;line-height:1.2}
.btn small{display:block;font-size:.65rem;opacity:.8;margin-top:.15rem}
.btn.is-on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.step-val{min-width:4.5rem;text-align:center}
.step-val b{display:block;font-size:1.25rem}
.step-val small{color:var(--mu);font-size:.7rem;text-transform:uppercase}
.speech{color:var(--mu);font-size:.9rem}
.speech input,select{height:2.75rem;border:1px solid var(--bd);background:var(--el);color:var(--fg);border-radius:.5rem;padding:0 .6rem;font-size:1rem}
.speech input{width:4rem;text-align:center}
select{width:100%;margin:.35rem 0}
.tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.25rem;margin-top:.6rem}
.hint{font-size:.7rem;color:var(--mu);margin:.5rem 0 0}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem}
.stat{border:1px solid var(--bd);background:var(--el);border-radius:.75rem;padding:.6rem}
.stat small{display:block;font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.stat b{display:block;font-size:1.15rem;margin-top:.15rem}
.stat em{display:block;font-size:.65rem;color:var(--mu);font-style:normal}
.bands{display:flex;flex-wrap:wrap;gap:.4rem;margin:.7rem 0}
.band{border:1px solid var(--bd);background:var(--el);color:var(--mu);border-radius:999px;padding:.15rem .7rem;font-size:.75rem}
.band.ok{border-color:#2d4a3a;background:var(--okbg);color:var(--ok)}
.band.warn{border-color:#5a4630;background:var(--warnbg);color:var(--warn)}
.crisis{margin:.7rem 0;padding:.7rem .8rem;border:1px solid #5a4630;background:var(--warnbg);border-radius:.7rem;color:var(--warn)}
.crisis b{color:var(--fg);display:block}
.track{position:relative;height:5.5rem;margin:.4rem .2rem 0}
.track .bar{position:absolute;left:0;right:0;top:1.7rem;height:4px;background:var(--el);border-radius:99px}
.track .dot{position:absolute;top:1.45rem;width:12px;height:12px;background:var(--acc);border-radius:50%;transform:translateX(-50%)}
.track .now{position:absolute;top:0;transform:translateX(-50%);font-size:.65rem;white-space:nowrap}
.track .mark{position:absolute;top:2.3rem;font-size:.62rem;color:var(--mu);max-width:7rem}
.track .mark.l{left:0} .track .mark.r{right:0;text-align:right}
.roster{border:1px solid var(--bd);background:var(--el);border-radius:.7rem;padding:.75rem;margin-top:.7rem}
.roster ul{list-style:none;margin:.5rem 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:.3rem .8rem}
.roster li{display:flex;justify-content:space-between;gap:.4rem;font-size:.9rem}
.row{display:flex;gap:.75rem;border-bottom:1px solid var(--bd);padding:.7rem 0;cursor:pointer}
.row:last-of-type{border:0}
.row.dim{opacity:.45}
.row b{display:block}
.row i{display:block;font-style:normal;font-size:.9rem;margin-top:.15rem}
.row input{margin-top:.35rem}
.recs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem}
.rec{border:1px solid var(--bd);background:var(--el);border-radius:.7rem;padding:.7rem .8rem}
.rec.ok{border-color:#2d4a3a;background:var(--okbg)}
.rec.warn{border-color:#5a4630;background:var(--warnbg);color:var(--warn)}
.rec p{margin:.2rem 0 0;color:var(--mu);font-size:.9rem}
.rec b{color:var(--fg);font-size:.9rem}
table{width:100%;font-size:.9rem;border-collapse:collapse}
th{text-align:left;color:var(--mu);font-weight:500;padding:.25rem 0}
td{border-top:1px solid var(--bd);padding:.4rem 0}
.num{font-variant-numeric:tabular-nums}
details summary{cursor:pointer;font-weight:600}
pre{white-space:pre-wrap;background:var(--el);padding:.75rem;border-radius:.6rem;font:12px/1.45 ui-monospace,Menlo,monospace;color:var(--mu);overflow:auto}
button:not(:disabled){cursor:pointer}
</style>
</head>

      (s.third === 0 ? "—" : "сила " + M.fmtSigned(yakSwap.dp) + " · " + M.fmtSigned(yakSwap.dt) + " мин") +
      "</small></button></div>" +
      '<p class="hint">' +
      (s.third !== 2
        ? "Маньяк вместо 1 мафии: " + manSwap.fromM + " чёрных → " + manSwap.toM + " + маньяк. Тайминг за счёт второй ночной пули."
        : "Второй якудза с мирного слота. Одна командная пуля, как у маньяка.") +
      "</p></section>" +
      '<section class="card">' +
      '<div class="stats">' +
      '<div class="stat"><small>Минуты</small><b>' +
      m.tExp +
      '</b><em>' +
      m.tMin +
      "–" +
      m.tMax +
      "</em></div>" +
      '<div class="stat"><small>Тайминг</small><b>' +
      esc(m.tempo) +
      "</b></div>" +
      '<div class="stat"><small>Сила</small><b>' +
      esc(m.force.replace("город ", "")) +
      "</b></div></div>" +
      '<div class="bands">' +
      band("средние " + m.billR + " · " + m.tExp + " мин", m.talkCrisis ? "warn" : m.tempo === "норма" ? "ok" : "") +
      band(esc(m.force) + (m.force === "город жирнее" ? " · новичкам ок" : ""), m.force === "город жирнее" ? "ok" : "") +
      band((m.talkCrisis ? "⚠ " : "") + esc(m.tempo), m.talkCrisis ? "warn" : "ok") +
      band("p " + (m.p > 0 ? "+" : "") + m.p, "") +
      "</div>" +
      (m.talkCrisis
        ? '<div class="crisis"><b>Средние ' +
          m.billR +
          " раунда — мало общения</b><p>Не путайте с быстрым концом мафии (" +
          m.minR +
          "). Нужно ≥ 3 средних круга.</p></div>"
        : "") +
      (fork
        ? '<p class="muted">Вилка ' +
          s.mafia +
          "/" +
          (s.mafia + 1) +
          ": " +
          m.tExp +
          " мин, " +
          esc(m.force) +
          " vs " +
          fork.tExp +
          " мин, " +
          esc(fork.force) +
          "</p>"
        : "") +
      '<h2>Средние раунды</h2>' +
      '<div class="track"><i class="bar"></i><i class="dot" style="left:' +
      pLeft +
      '%"></i>' +
      '<span class="mark l">быстр. ' +
      m.minR +
      " · " +
      m.tMin +
      "м</span>" +
      '<span class="mark r">пот. ' +
      m.maxR +
      " · " +
      m.tMax +
      "м</span>" +
      '<span class="now" style="left:' +
      pLeft +
      '%">средн. ' +
      m.billR +
      " · " +
      m.tExp +
      "м</span></div>" +
      '<p class="muted">' +
      m.days +
      " дней речей · " +
      (m.extra ? "вторая ночная пуля" : s.poison ? "яд после голоса" : "одна ночная пуля") +
      " · цель средних ≥ 3</p>" +
      '<div class="roster"><div class="row-between"><b>' +
      pack.unique +
      ' разных ролей</b><span class="' +
      (load.ok ? "ok" : "warn") +
      '">' +
      esc(load.label) +
      "</span></div><ul>" +
      lines +
      "</ul>" +
      (s.don ? '<p class="muted">Новичкам проще без дона: −1 роль, мафия без поисковика.</p>' : "") +
      "</div></section>" +
      '<section class="card"><h2>Набор правил</h2><div class="tri">' +
      HOUSES.map(function (h) {
        return (
          '<button type="button" class="' +
          on("btn", s.house === h.id) +
          '" data-act="h:' +
          h.id +
          '">' +
          esc(h.label) +
          "</button>"
        );
      }).join("") +
      '</div><p class="muted">' +
      esc(M.houseHint(s)) +
      "</p></section>" +
      '<section class="card"><h2>Правила</h2>' +
      check(
        "shoot",
        s.shoot,
        "Шериф стреляет",
        s.shoot ? "сила +0.50 к якорю ФИИМ · тайминг −1.05" : "если включить: сила города +0.50 · тайминг −0.90",
        "",
        false,
      ) +
      check(
        "poison",
        s.poison,
        "Маньяк — отравитель",
        s.third !== 1 ? "нужен слот «1 маньяк»" : "сила города +0.20 · тайминг +0.7 · нет второй утренней пули",
        "День ещё жива: речь и голос есть.",
        s.third !== 1,
      ) +
      check(
        "bazaar",
        s.bazaar,
        "Балаган 2 мин перед кругом",
        s.bazaar ? "+2 мин каждый день" : "свободный разговор до минуты №1 — не колода",
        "",
        false,
      ) +
      '<label class="muted">Путана</label><select id="putana">' +
      PUTANA.map(function (p) {
        return '<option value="' + p.id + '"' + (s.putana === p.id ? " selected" : "") + ">" + esc(p.label) + "</option>";
      }).join("") +
      '</select><p class="muted">' +
      esc(put.why) +
      "</p>" +
      check("reveal", s.reveal, "Роли оглашают при смерти", s.reveal ? "сила города +0.35 к якорю спорта" : "якорь ФИИМ: карта уходит молча", "", false) +
      check("hiddenM", s.hiddenM, "Стол не знает число мафии", "вилка M / M+1, не совет по умолчанию", "", false) +
      "</section>" +
      '<section class="card"><h2>Слоты</h2>' +
      check("sheriff", s.sheriff, "Шериф", s.shoot ? "тайминг −1.05 · сила +0.50 к ФИИМ" : "тайминг −0.15 · сила 0 (якорь ФИИМ)", "", false) +
      check("don", s.don, "Дон", s.don ? "сила 0 (якорь ФИИМ)" : "без дона: сила города +0.15", "", false) +
      check("doctor", s.doctor, "Доктор", "тайминг +0.4 · сила +" + (s.putana !== "off" ? "0.22" : "0.38"), "", false) +
      check("lucky", s.lucky, "Везунчик", "тайминг +0.5 · сила +0.20", "", false) +
      "</section>" +
      '<section class="card"><h2>Рекомендации столу</h2><ul class="recs">' +
      recHtml +
      "</ul></section>" +
      '<section class="card"><h2>Сравнение путан</h2><table><thead><tr><th>Режим</th><th>сила</th><th>тайминг</th><th>бейдж</th></tr></thead><tbody>' +
      putRows +
      "</tbody></table>" +
      '<p class="muted">Выстрел шерифа: сила ' +
      (shootDp > 0 ? "+" : "") +
      shootDp +
      " · тайминг " +
      shootDr +
      " раунда.</p>" +
      poiLine +
      "</section>" +
      "<details class='card'><summary>Подробный расчёт</summary><pre>" +
      esc(spoiler) +
      "</pre></details>";
  }

  root.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var a = t.getAttribute("data-act");
    if (a === "n-") stepN(-1);
    else if (a === "n+") stepN(1);
    else if (a === "m-") stepM(-1);
    else if (a === "m+") stepM(1);
    else if (a === "t0") setThird(0);
    else if (a === "t1") setThird(1);
    else if (a === "t2") setThird(2);
    else if (a.indexOf("h:") === 0) {
      s = M.applyHouse(s, a.slice(2));
      draw();
    } else if (t.type === "checkbox") {
      var map = {
        shoot: "shoot",
        poison: "poison",
        bazaar: "bazaar",
        reveal: "reveal",
        hiddenM: "hiddenM",
        sheriff: "sheriff",
        don: "don",
        doctor: "doctor",
        lucky: "lucky",
      };
      if (map[a]) set((function () { var o = {}; o[map[a]] = t.checked; return o; })());
    }
  });
  root.addEventListener("change", function (e) {
    if (e.target.id === "speech") set({ speech: M.clamp(+e.target.value || 60, 20, 120) });
    if (e.target.id === "putana") set({ putana: e.target.value });
  });
  draw();
})();

</script>
</body>
</html>
